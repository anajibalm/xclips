[package]
name = "xclips"
version = "1.1.0"
description = "xclips — Smart Video Clipper & Short-Form Studio"
authors = ["efx", "Masagi"]
edition = "2021"

[lib]
name = "xclips_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-opener = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
